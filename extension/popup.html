<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Nest</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        color: #111;
        background: #f2f2f7;
        width: 320px;
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .header img { width: 24px; height: 24px; }
      .header h1 { font-size: 15px; font-weight: 600; }
      .field {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(60,60,67,.2);
        border-radius: 10px;
        font-size: 14px;
        background: #fff;
        outline: none;
        margin-bottom: 8px;
      }
      .field:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,.15); }
      .button {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: #007aff;
        color: #fff;
      }
      .button:disabled { opacity: .5; cursor: default; }
      .status {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
      }
      .status--ok  { background: rgba(31,156,85,.12); color: #1f9c55; }
      .status--err { background: rgba(214,64,69,.1); color: #d64045; }
      .status--dup { background: rgba(183,121,31,.12); color: #b7791f; }
      .status a { color: inherit; text-underline-offset: 2px; }
      .not-configured { color: #6e6e73; font-size: 13px; text-align: center; padding: 8px 0; }
      .not-configured a { color: #007aff; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon-48.png" alt="" />
      <h1>Link Nest</h1>
    </div>
    <div id="main">
      <input id="url"   class="field" type="url"  placeholder="URL"   readonly />
      <input id="title" class="field" type="text" placeholder="Title" />
      <input id="tags"  class="field" type="text" placeholder="Tags (comma-separated)" />
      <button id="save" class="button">Save Link</button>
      <div id="status" class="status"></div>
    </div>
    <div id="not-configured" class="not-configured" style="display:none">
      Configure your Link Nest server in <a href="#" id="open-settings">extension settings</a>.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
