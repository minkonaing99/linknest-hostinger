<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Nest</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        color: oklch(24% .012 155);
        background: oklch(96% .012 155);
        width: 340px;
        padding: 12px;
      }
      .capture-panel {
        background: oklch(99% .006 155);
        border: 1px solid oklch(89% .018 155);
        border-radius: 18px;
        box-shadow: 0 10px 28px oklch(30% .025 155 / .1);
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .header img { width: 28px; height: 28px; border-radius: 8px; }
      .header h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
      #main { display: grid; gap: 10px; }
      .field {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid oklch(86% .018 155);
        border-radius: 13px;
        font-size: 14px;
        color: inherit;
        background: oklch(97.5% .008 155);
        outline: none;
        transition: border-color 180ms ease-out, box-shadow 180ms ease-out, background 180ms ease-out;
      }
      .field[readonly] { color: oklch(48% .012 155); }
      .field:focus { background: oklch(99% .006 155); border-color: oklch(54% .13 155); box-shadow: 0 0 0 3px oklch(68% .12 155 / .18); }
      .button {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: none;
        border-radius: 13px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: oklch(54% .13 155);
        color: oklch(99% .006 155);
        transition: transform 160ms ease-out, background 160ms ease-out, opacity 160ms ease-out;
      }
      .button:hover { background: oklch(49% .13 155); }
      .button:active { transform: scale(.985); }
      .button:disabled { opacity: .5; cursor: default; }
      .button:focus-visible, .not-configured a:focus-visible { outline: 3px solid oklch(68% .12 155 / .35); outline-offset: 2px; }
      .status {
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.4;
        display: none;
      }
      .status--ok  { background: oklch(94% .04 155); color: oklch(42% .12 155); }
      .status--err { background: oklch(95% .035 25); color: oklch(48% .17 25); }
      .status--dup { background: oklch(95% .045 80); color: oklch(46% .11 70); }
      .status a { color: inherit; text-underline-offset: 2px; }
      .not-configured { color: oklch(46% .012 155); font-size: 13px; line-height: 1.5; text-align: center; padding: 12px 4px 4px; }
      .not-configured a { color: oklch(47% .13 155); font-weight: 600; text-underline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { .field, .button { transition: none; } }
    </style>
  </head>
  <body>
    <div class="capture-panel">
      <div class="header">
        <img src="icons/icon-48.png" alt="" />
        <h1>Save to Link Nest</h1>
      </div>
      <div id="main">
        <input id="url" class="field" type="url" placeholder="URL" aria-label="URL" readonly />
        <input id="title" class="field" type="text" placeholder="Title" aria-label="Title" />
        <input id="tags" class="field" type="text" placeholder="Tags (comma-separated)" aria-label="Tags" />
        <button id="save" class="button">Save Link</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
      <div id="not-configured" class="not-configured" style="display:none">
        Configure your Link Nest server in <a href="#" id="open-settings">extension settings</a>.
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
