<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Nest - Extension Settings</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        color: oklch(24% .012 155);
        background: oklch(96% .012 155);
        min-height: 100vh;
        padding: 40px 16px;
      }
      .settings-shell { max-width: 520px; margin: 0 auto; }
      .header { display: flex; align-items: center; gap: 12px; margin: 0 4px 18px; }
      .header img { width: 36px; height: 36px; border-radius: 10px; }
      .header h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
      .header p { color: oklch(48% .012 155); font-size: 13px; margin-top: 2px; }
      .settings-panel {
        background: oklch(99% .006 155);
        border: 1px solid oklch(89% .018 155);
        border-radius: 20px;
        box-shadow: 0 14px 36px oklch(30% .025 155 / .09);
        padding: 22px;
      }
      .panel-title { font-size: 16px; font-weight: 650; margin-bottom: 20px; }
      .field-group + .field-group { margin-top: 18px; }
      label { display: block; font-size: 13px; font-weight: 600; color: oklch(38% .015 155); margin-bottom: 7px; }
      .field {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid oklch(86% .018 155);
        border-radius: 13px;
        font-size: 14px;
        color: inherit;
        background: oklch(97.5% .008 155);
        outline: none;
        font-family: inherit;
        transition: border-color 180ms ease-out, box-shadow 180ms ease-out, background 180ms ease-out;
      }
      .field:focus { background: oklch(99% .006 155); border-color: oklch(54% .13 155); box-shadow: 0 0 0 3px oklch(68% .12 155 / .18); }
      .hint { font-size: 12px; line-height: 1.45; color: oklch(50% .012 155); margin-top: 6px; }
      .hint a { color: oklch(47% .13 155); font-weight: 600; text-underline-offset: 2px; }
      .button {
        width: 100%;
        min-height: 44px;
        margin-top: 22px;
        padding: 10px 18px;
        border: none;
        border-radius: 13px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: oklch(54% .13 155);
        color: oklch(99% .006 155);
        transition: transform 160ms ease-out, background 160ms ease-out;
      }
      .button:hover { background: oklch(49% .13 155); }
      .button:active { transform: scale(.99); }
      .button:focus-visible, .hint a:focus-visible { outline: 3px solid oklch(68% .12 155 / .35); outline-offset: 2px; }
      .status { min-height: 18px; margin-top: 12px; font-size: 13px; text-align: center; }
      .status--ok  { color: oklch(42% .12 155); }
      .status--err { color: oklch(48% .17 25); }
      @media (max-width: 560px) { body { padding: 20px 12px; } .settings-panel { padding: 18px; } }
      @media (prefers-reduced-motion: reduce) { .field, .button { transition: none; } }
    </style>
  </head>
  <body>
    <main class="settings-shell">
      <div class="header">
        <img src="icons/icon-48.png" alt="" />
        <div>
          <h1>Extension Settings</h1>
          <p>Connect this browser to Link Nest.</p>
        </div>
      </div>

      <section class="settings-panel" aria-labelledby="api-connection-title">
        <h2 id="api-connection-title" class="panel-title">API connection</h2>
        <form id="settings-form">
          <div class="field-group">
            <label for="server-url">Server URL</label>
            <input id="server-url" class="field" type="url" placeholder="https://your-server.example.com" required />
            <p class="hint">Your Link Nest base URL, without a trailing slash.</p>
          </div>

          <div class="field-group">
            <label for="api-token">API token</label>
            <input id="api-token" class="field" type="password" placeholder="Paste a write-scoped API token" required autocomplete="off" />
            <p class="hint">Create one on the <a href="#" id="open-settings-link">Link Nest settings page</a>. Write scope is required.</p>
          </div>

          <button type="submit" class="button">Save Connection</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="settings.js"></script>
  </body>
</html>
