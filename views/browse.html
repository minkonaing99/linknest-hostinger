<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Link Nest" />
    <title>Browse Links · Link Nest</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/collection.css" />
    <link rel="stylesheet" href="/css/browse.css" />
  </head>
  <body class="collection-page" data-page="browse">
    <div class="app-shell">
      <header class="page-header library-header">
        <div class="page-bar">
          <div class="page-bar__identity">
            <img class="brand-mark" src="/img/logo-mark.png" alt="" />
            <span class="page-kicker">Link Nest</span>
          </div>
          <nav class="segmented-nav" aria-label="Primary">
            <a class="segmented-nav__item" href="/">Home</a>
            <a class="segmented-nav__item is-active" href="/browse.html" aria-current="page">Browse <span class="nav-badge hidden" id="unread-badge"></span></a>
            <a class="segmented-nav__item" href="/archive.html">Archive</a>
          </nav>
          <button type="button" class="button button--ghost button--small button--logout" id="logout-button">Logout</button>
        </div>
      </header>

      <main class="library-main">
        <div class="library-intro">
          <div class="page-heading">
            <h1 class="page-title">Library</h1>
          </div>
          <a class="button library-add" href="/editor.html"><span aria-hidden="true">+</span> Add link</a>
        </div>

        <div class="surface surface--group library-workspace">
          <div class="library-toolbar">
            <div class="library-search" role="search">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input id="search" class="field field--search" type="search" aria-label="Search saved links" enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search links, notes, and tags" />
            </div>
            <div class="filter-grid">
              <div>
                <label for="status-filter">Status</label>
                <select id="status-filter" class="field field--select">
                  <option value="all">All statuses</option>
                  <option value="saved">Saved</option>
                  <option value="unread">Unread</option>
                  <option value="useful">Useful</option>
                  <option value="archived">Archived</option>
                </select>
              </div>
              <div>
                <label for="sort-mode">Sort by</label>
                <select id="sort-mode" class="field field--select">
                  <option value="recent">Most recent</option>
                  <option value="date-asc">Oldest first</option>
                  <option value="title-asc">Title A-Z</option>
                  <option value="title-desc">Title Z-A</option>
                </select>
              </div>
            </div>
          </div>
          <aside class="library-filters" aria-label="Library filters">
            <div class="quick-filter-row" role="group" aria-label="Quick filters">
              <button type="button" class="button button--ghost button--small quick-filter-btn" title="Due to revisit" aria-pressed="false" data-filter="remind">Due to revisit</button>
              <button type="button" class="button button--ghost button--small quick-filter-btn" title="Review queue" aria-pressed="false" data-filter="review">Review queue</button>
              <button type="button" class="button button--ghost button--small quick-filter-btn" title="Older than 90 days" aria-pressed="false" data-filter="age">Older than 90 days</button>
              <button type="button" class="button button--ghost button--small quick-filter-btn" title="YouTube" aria-pressed="false" data-filter="youtube">YouTube</button>
            </div>
          </aside>

          <section class="library-results" aria-labelledby="library-results-title">
            <div class="section-header">
              <div class="section-header__left">
                <h2 class="section-title" id="library-results-title">Saved links</h2>
                <p class="section-copy" id="library-counts"><span id="visible-count">0</span> of <span id="total-count">0</span> links</p>
                <p id="review-progress" class="section-copy hidden" role="status" aria-live="polite"></p>
              </div>
              <div class="browse-actions">
                <button type="button" id="export-view-btn" class="button button--ghost" disabled>Export current view</button>
                <button type="button" id="select-toggle-btn" class="button button--ghost" title="Select links">Select</button>
              </div>
            </div>
            <p id="export-message" class="form-message" role="status" aria-live="polite"></p>
            <div id="tag-chips" class="tag-chips hidden"></div>
            <div id="link-list" class="list-stack list-stack--tight list-stack--rows"></div>
            <div id="scroll-sentinel"></div>
          </section>
        </div>
      </main>
    </div>

    <template id="library-empty-template">
      <div class="library-empty">
        <div class="library-empty__art" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
          </svg>
        </div>
        <h3>No links in this view yet</h3>
        <p>Save an article, a reference, or anything worth coming back to.</p>
        <a class="button button--ghost" href="/editor.html">Save a link</a>
      </div>
    </template>

    <div id="bulk-bar" class="bulk-bar hidden">
      <span id="bulk-count" class="bulk-bar__count">0 selected</span>
      <div class="bulk-bar__actions">
        <button type="button" id="bulk-select-all" class="button button--ghost button--small">Select all</button>
        <button type="button" id="export-selected-btn" class="button button--ghost button--small" disabled>Export selected</button>
        <select id="bulk-status-select" class="field field--select field--small">
          <option value="" disabled selected>Set status…</option>
          <option value="saved">Saved</option>
          <option value="unread">Unread</option>
          <option value="useful">Useful</option>
        </select>
        <button type="button" id="bulk-delete-btn" class="button button--small button--danger">Delete</button>
        <button type="button" id="bulk-cancel-btn" class="button button--ghost button--small">Cancel</button>
      </div>
    </div>

    <template id="link-template">
      <article class="library-row">
        <div class="library-row__status">
          <span class="status-dot"></span>
        </div>
        <img class="link-thumbnail hidden" alt="" loading="lazy" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" width="160" height="90" />
        <div class="library-row__main">
          <div class="library-row__title-line">
            <a class="library-row__title" target="_blank" rel="noreferrer"></a>
          </div>
          <div class="library-row__meta">
            <span class="link-host"></span>
            <span>&bull;</span>
            <span class="link-date"></span>
            <span>&bull;</span>
            <span class="status-text"></span>
          </div>
          <p class="library-row__notes hidden"></p>
          <div class="age-warning hidden">
            <span class="age-warning__text">Saved over 90 days ago</span>
            <div class="age-warning__actions">
              <button type="button" class="age-review-button age-warning__action">Review now</button>
              <button type="button" class="age-archive-button age-warning__action age-warning__action--danger">Archive</button>
              <button type="button" class="age-keep-button age-warning__action">Keep for 90 days</button>
            </div>
          </div>
          <div class="useful-review-prompt age-warning hidden">
            <span class="age-warning__text">Useful 30 days ago. Keep it?</span>
            <div class="age-warning__actions">
              <button type="button" class="useful-review-confirm age-warning__action">Still useful</button>
              <button type="button" class="useful-review-note age-warning__action">Add note</button>
              <button type="button" class="useful-review-archive age-warning__action age-warning__action--danger">Archive</button>
            </div>
          </div>
          <p class="save-reason hidden"></p>
          <div class="review-note-panel hidden">
            <label class="field-group">
              <span>Review note</span>
              <textarea class="field field--textarea review-note-input" rows="3" maxlength="10000"></textarea>
            </label>
            <div class="review-note-actions">
              <button type="button" class="button button--small review-note-save">Save note</button>
              <button type="button" class="button button--ghost button--small review-note-cancel">Cancel</button>
            </div>
          </div>
          <div class="library-row__tags tag-row hidden"></div>
        </div>
        <div class="library-row__tail">
          <div class="row-menu">
            <button type="button" class="row-menu__trigger" aria-label="More actions" aria-expanded="false">•••</button>
            <div class="row-menu__popover hidden">
              <button type="button" class="row-menu__item copy-link-button hidden">Copy link</button>
              <button type="button" class="row-menu__item favorite-button">Add to Favorites</button>
              <a class="row-menu__item edit-link" href="#">Add note</a>
              <button type="button" class="row-menu__item mark-useful-button">Mark useful</button>
              <button type="button" class="row-menu__item snooze-week-button">Snooze 1 week</button>
              <label class="row-menu__date-label">
                <span>Snooze until</span>
                <input type="date" class="row-menu__date" aria-label="Snooze until" />
              </label>
              <button type="button" class="row-menu__item row-menu__item--danger delete-button">Archive</button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="/js/offline-store.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/undo.js"></script>
    <script src="/js/offline-library.js"></script>
    <script src="/js/offline-queue.js"></script>
    <script src="/js/browse.js"></script>
  </body>
</html>
