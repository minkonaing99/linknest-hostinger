<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Link Nest" />
    <title>Link Nest</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/collection.css" />
  </head>
  <body class="collection-page" data-page="home">
    <div class="app-shell">
      <header class="page-header library-header">
        <div class="page-bar">
          <div class="page-bar__identity">
            <img class="brand-mark" src="/img/logo-mark.png" alt="" />
            <span class="page-kicker">Link Nest</span>
          </div>
          <nav class="segmented-nav" aria-label="Primary">
            <a class="segmented-nav__item is-active" href="/" aria-current="page">Home</a>
            <a class="segmented-nav__item" href="/browse.html">Browse <span class="nav-badge hidden" id="unread-badge"></span></a>
            <a class="segmented-nav__item" href="/archive.html">Archive</a>
          </nav>
          <button type="button" class="button button--ghost button--small button--logout" id="logout-button">Logout</button>
        </div>
      </header>

      <main class="library-main home-layout">
        <div class="library-intro">
          <div class="page-heading">
            <h1 class="page-title">Home</h1>
          </div>
        </div>

        <section class="surface surface--group library-panel home-capture" aria-labelledby="capture-heading">
          <div class="section-header">
            <div>
              <h2 class="section-title" id="capture-heading">Quick capture</h2>
            </div>
            <a class="button button--ghost button--small" href="/editor.html">Open link editor</a>
          </div>
          <form id="quick-add-form" class="form-stack form-stack--tight">
            <label for="quick-add-url">Link URL</label>
            <div class="quick-entry">
              <input id="quick-add-url" class="field quick-add-row__input" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com/article" required />
              <button type="submit" id="quick-add-submit" class="button library-primary">Save link</button>
              <button type="button" id="quick-add-paste" class="button button--ghost quick-add-row__button">Paste and save</button>
            </div>
            <details class="quick-add-reason">
              <summary>Why save this? (optional)</summary>
              <label class="field-group">
                <span>Save reason</span>
                <textarea id="quick-add-reason" class="field" rows="2" maxlength="500" placeholder="For my exam, project, or later reference"></textarea>
              </label>
            </details>
            <p id="quick-add-message" class="form-message" role="status" aria-live="polite" tabindex="-1"></p>
          </form>
        </section>

        <section class="surface surface--group library-panel home-links" aria-labelledby="review-heading">
          <div class="section-header">
            <div>
              <div class="title-with-badge">
                <h2 class="section-title" id="review-heading">Review</h2>
                <span class="review-badge hidden" id="review-badge" aria-label="Review items pending" aria-live="polite"></span>
              </div>
            </div>
            <a class="button button--ghost" href="/browse.html?review=1">Review all</a>
          </div>
          <div id="review-links" class="recent-list" aria-live="polite"></div>
        </section>

        <section class="surface surface--group library-panel home-links" aria-labelledby="recent-heading">
          <div class="section-header">
            <div>
              <h2 class="section-title" id="recent-heading">Recently saved</h2>
            </div>
            <a class="button button--ghost" href="/browse.html">Open library</a>
          </div>
          <div id="recent-links" class="recent-list"></div>
        </section>

        <section id="weekly-summary" class="home-insights insight-section" aria-labelledby="weekly-heading">
          <div class="section-header section-header--compact">
            <div>
              <h2 class="section-title" id="weekly-heading">This week</h2>
              <p class="section-copy">Today and the previous six days.</p>
            </div>
          </div>
          <dl class="weekly-metrics" aria-live="polite">
            <div><dt>Saved</dt><dd id="weekly-saved">0</dd></div>
            <div><dt>Reviewed</dt><dd id="weekly-reviewed">0</dd></div>
            <div><dt>Useful</dt><dd id="weekly-useful">0</dd></div>
            <div><dt>Revisit rate</dt><dd id="weekly-revisit">Building baseline</dd></div>
          </dl>
          <p class="weekly-oldest">Oldest unresolved: <a id="weekly-oldest" href="/browse.html?review=1">None</a></p>
        </section>
      </main>
    </div>

    <template id="link-template">
      <article class="recent-row">
        <div class="recent-row__status"><span class="status-dot"></span></div>
        <div class="recent-row__main">
          <a class="recent-row__title" target="_blank" rel="noreferrer"></a>
          <div class="recent-row__meta">
            <span class="link-host"></span>
            <span>&bull;</span>
            <span class="link-date"></span>
            <span>&bull;</span>
            <span class="status-text"></span>
          </div>
          <p class="save-reason hidden"></p>
        </div>
        <div class="recent-row__tail">
          <div class="row-menu">
            <button type="button" class="row-menu__trigger" aria-label="More actions" aria-expanded="false">•••</button>
            <div class="row-menu__popover hidden">
              <a class="row-menu__item home-edit-link">Edit</a>
              <button type="button" class="row-menu__item favorite-button">Add to Favorites</button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="/js/offline-store.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/undo.js"></script>
    <script src="/js/offline-library.js"></script>
    <script src="/js/offline-queue.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
