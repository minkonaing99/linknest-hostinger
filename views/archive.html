<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Link Nest" />
    <title>Archive · Link Nest</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/collection.css" />
  </head>
  <body class="collection-page" data-page="archive">
    <div class="app-shell">
      <header class="page-header library-header">
        <div class="page-bar">
          <div class="page-bar__identity">
            <img class="brand-mark" src="/img/logo-mark.png" alt="" />
            <span class="page-kicker">Link Nest</span>
          </div>
          <nav class="segmented-nav" aria-label="Primary">
            <a class="segmented-nav__item" href="/">Home</a>
            <a class="segmented-nav__item" href="/browse.html">Browse <span class="nav-badge hidden" id="unread-badge"></span></a>
            <a class="segmented-nav__item is-active" href="/archive.html" aria-current="page">Archive</a>
          </nav>
          <button type="button" class="button button--ghost button--small button--logout" id="logout-button">Logout</button>
        </div>
      </header>

      <main class="library-main">
        <div class="library-intro">
          <div class="page-heading">
            <h1 class="page-title">Archive</h1>
          </div>
        </div>

        <section class="surface surface--group library-panel archive-panel" aria-labelledby="archive-heading">
          <div class="section-header">
            <div>
              <h2 class="section-title" id="archive-heading">Deleted links</h2>
              <p class="section-copy" role="status"><span id="total-count">—</span> total</p>
            </div>
            <button type="button" id="delete-all-btn" class="button button--ghost button--danger" disabled>Delete all permanently</button>
          </div>
          <div id="archive-loading" class="list-stack list-stack--rows" role="status" aria-label="Loading deleted links">
            <div class="skeleton-row" aria-hidden="true"></div>
            <div class="skeleton-row" aria-hidden="true"></div>
            <div class="skeleton-row" aria-hidden="true"></div>
          </div>
          <div id="link-list" class="list-stack list-stack--tight list-stack--rows" aria-busy="true"></div>
          <div id="archive-load-error" class="empty-state hidden">
            <p role="alert">Could not load deleted links.</p>
            <button type="button" id="archive-retry" class="button button--ghost">Try again</button>
          </div>
          <div id="load-more-wrap" class="load-more-wrap hidden">
            <button type="button" id="load-more" class="button button--ghost">Load more</button>
          </div>
        </section>
      </main>
    </div>

    <template id="archive-empty-template">
      <div class="library-empty">
        <div class="library-empty__art" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="5" x="2" y="3" rx="1" />
            <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4" />
          </svg>
        </div>
        <h3>No deleted links</h3>
        <p>Links you archive from your library will appear here.</p>
        <a class="button button--ghost" href="/browse.html">Back to library</a>
      </div>
    </template>

    <template id="archive-template">
      <article class="library-row">
        <div class="library-row__status">
          <span class="status-dot status-dot--archived"></span>
        </div>
        <div class="library-row__main">
          <div class="library-row__title-line">
            <a class="library-row__title" target="_blank" rel="noreferrer"></a>
          </div>
          <div class="library-row__meta">
            <span class="link-host"></span>
            <span>&bull;</span>
            <span class="link-date"></span>
            <span>&bull;</span>
            <span class="deleted-at"></span>
          </div>
        </div>
        <div class="library-row__tail archive-actions">
          <button type="button" class="button button--ghost button--small restore-button">Restore</button>
          <button type="button" class="button button--ghost button--small button--danger hard-delete-button">Delete permanently</button>
        </div>
      </article>
    </template>

    <script src="/js/offline-store.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/undo.js"></script>
    <script src="/js/offline-library.js"></script>
    <script src="/js/offline-queue.js"></script>
    <script src="/js/archive.js"></script>
  </body>
</html>
